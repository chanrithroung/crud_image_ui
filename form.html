<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add/Edit Record</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="logo">
                <i class="fas fa-database"></i>
                <span>DataManager</span>
            </div>
            <nav>
                <ul>
                    <li><a href="table.html"><i class="fas fa-table"></i> View Records</a></li>
                    <li class="active"><a href="form.html"><i class="fas fa-plus-circle"></i> Add Record</a></li>
                    <li><a href="#"><i class="fas fa-chart-bar"></i> Dashboard</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Settings</a></li>
                </ul>
            </nav>
        </div>
        
        <main>
            <header>
                <h1>Add New Record</h1>
                <div class="user-info">
                    <span>Admin User</span>
                    <div class="avatar">
                        <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="User Avatar">
                    </div>
                </div>
            </header>
            
            <div class="content">
                <div class="card">
                    <form class="crud-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="title">Title</label>
                                <input type="text" id="title" name="title" placeholder="Enter title" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="category">Category</label>
                                <select id="category" name="category" required>
                                    <option value="">Select category</option>
                                    <option value="technology">Technology</option>
                                    <option value="health">Health</option>
                                    <option value="education">Education</option>
                                    <option value="business">Business</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-row">
                            <div class="form-group">
                                <label for="price">Price</label>
                                <input type="number" id="price" name="price" placeholder="Enter price" step="0.01" required>
                            </div>
                            
                            <div class="form-group">
                                <label for="status">Status</label>
                                <select id="status" name="status" required>
                                    <option value="">Select status</option>
                                    <option value="active">Active</option>
                                    <option value="inactive">Inactive</option>
                                    <option value="pending">Pending</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" rows="4" placeholder="Enter description" required></textarea>
                        </div>
                        
                        <div class="form-group">
                            <label for="image">Image Upload</label>
                            <div class="image-upload-container">
                                <div class="image-preview" id="imagePreview">
                                    <i class="fas fa-image"></i>
                                    <span>No image selected</span>
                                </div>
                                <div class="image-upload-controls">
                                    <label for="image" class="upload-btn">
                                        <i class="fas fa-upload"></i> Choose Image
                                    </label>
                                    <input type="file" id="image" name="image" accept="image/*" onchange="previewImage(this)">
                                </div>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" class="btn btn-secondary" onclick="window.location.href='table.html'">Cancel</button>
                            <button type="submit" class="btn btn-primary">Save Record</button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        function previewImage(input) {
            const preview = document.getElementById('imagePreview');
            
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    preview.innerHTML = `<img src="${e.target.result}" alt="Image Preview">`;
                    preview.classList.add('has-image');
                }
                
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.innerHTML = `<i class="fas fa-image"></i><span>No image selected</span>`;
                preview.classList.remove('has-image');
            }
        }
    </script>
</body>
</html>
